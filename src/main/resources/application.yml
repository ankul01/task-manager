spring:
  application:
    name: task-manager
  datasource:
    url: jdbc:h2:mem:tasks;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  cache:
    disabled: true
  api-docs:
    enabled: true
    path: /openapi.json
  swagger-ui:
    enabled: true
    path: /docs
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
  paths-to-exclude: /actuator/**,/api/ping
  show-actuator: false