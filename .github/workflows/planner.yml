name: Plan a requirement

on:
  workflow_dispatch:
    inputs:
      requirement:
        description: "A small, non-sensitive product requirement"
        required: true
        type: string
      slug:
        description: "Short filename label (optional, e.g. add-due-dates)"
        required: false
        type: string
      model:
        description: "Optional model override (e.g. gemini-3.8-flash). Activates single-route mode."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-slim
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build prompt file
        env:
          REQUIREMENT: ${{ inputs.requirement }}
          RAW_SLUG: ${{ inputs.slug }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import re
          import sys

          requirement = os.environ["REQUIREMENT"].strip()
          raw_slug    = os.environ.get("RAW_SLUG", "").strip()
          run_url     = os.environ["RUN_URL"]

          if not requirement:
              sys.exit("Requirement input is empty.")

          # Build a safe, ASCII-only slug for branch and filename
          slug_source = raw_slug if raw_slug else " ".join(requirement.split()[:5])
          slug = re.sub(r"[^a-z0-9]+", "-", slug_source.lower()).strip("-")[:40] or "plan"
          timestamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%d-%H%M%S")
          plan_id   = f"{timestamp}-{slug}"

          print(f"Plan ID: {plan_id}")

          user_prompt = f"""You are a software planning assistant.

          Produce a concise plan for the requirement below. Include:
          1. Clarifying questions and assumptions
          2. Scope and non-goals
          3. Testable acceptance criteria
          4. Proposed implementation steps
          5. Test cases, risks, and a rollback approach

          Do not claim to have inspected a repository.
          Do not write or execute code.

          Requirement:
          {requirement}
          """

          pathlib.Path("/tmp/prompt.txt").write_text(user_prompt, encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"plan_id={plan_id}\n")
              out.write(f"plan_path=docs/plans/{plan_id}.md\n")
              out.write(f"branch_name=plan/{plan_id}\n")
          PY
        id: prep

      - name: Generate draft plan via LLM waterfall
        id: generate
        env:
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY:  ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY:  ${{ secrets.OPENAI_API_KEY }}
          # Pass model override through env to avoid shell injection from raw inputs.*
          MODEL_OVERRIDE:  ${{ inputs.model }}
        shell: bash
        run: |
          # Build args array with quoted expansions to prevent word-splitting
          args=(
            --profile planner
            --prompt-file /tmp/prompt.txt
            --output-file /tmp/llm_out.txt
            --meta-file   /tmp/meta.json
          )
          if [ -n "$MODEL_OVERRIDE" ]; then
            args+=(--model-override "$MODEL_OVERRIDE")
          fi
          python3 .github/scripts/llm_client.py "${args[@]}"

      - name: Assemble plan document and PR body
        id: assemble
        env:
          PLAN_ID:   ${{ steps.prep.outputs.plan_id }}
          PLAN_PATH: ${{ steps.prep.outputs.plan_path }}
          RUN_URL:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REQUIREMENT: ${{ inputs.requirement }}
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import pathlib

          plan_id     = os.environ["PLAN_ID"]
          plan_path   = pathlib.Path(os.environ["PLAN_PATH"])
          run_url     = os.environ["RUN_URL"]
          requirement = os.environ["REQUIREMENT"]

          meta = json.loads(pathlib.Path("/tmp/meta.json").read_text(encoding="utf-8"))
          model      = meta["model"]
          route_name = meta["route_name"]

          text        = pathlib.Path("/tmp/llm_out.txt").read_text(encoding="utf-8").strip()
          created_at  = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          safe_req    = json.dumps(requirement)

          document = (
              f"---\n"
              f"plan_id: {plan_id}\n"
              f"status: draft\n"
              f"created_at: {created_at}\n"
              f"model: {model}\n"
              f"route_name: {route_name}\n"
              f"workflow_run_url: {run_url}\n"
              f"requirement: {safe_req}\n"
              f"---\n\n"
              f"# Draft Plan: {plan_id}\n\n"
              f"> **Human Review Required:** Merging this Pull Request to the default branch "
              f"marks this exact file and commit SHA as approved for implementation.\n\n"
              f"{text}\n"
          )

          plan_path.parent.mkdir(parents=True, exist_ok=True)
          plan_path.write_text(document, encoding="utf-8")

          pr_body = (
              f"## Draft Plan Ready for Review\n\n"
              f"- **Plan ID:** `{plan_id}`\n"
              f"- **File:** `{plan_path.as_posix()}`\n"
              f"- **Model:** `{model}` (route: `{route_name}`)\n"
              f"- **Workflow Run:** {run_url}\n\n"
              f"### Approval Rule\n"
              f"Review the Markdown file in the **Files changed** tab. "
              f"Edit directly on this branch if needed. "
              f"Click **Merge pull request** only when you approve this exact version for Phase 2 implementation.\n"
          )
          pathlib.Path("/tmp/pr_body.md").write_text(pr_body, encoding="utf-8")
          PY

      - name: Commit plan and open Pull Request
        env:
          GH_TOKEN:    ${{ github.token }}
          PLAN_ID:     ${{ steps.prep.outputs.plan_id }}
          PLAN_PATH:   ${{ steps.prep.outputs.plan_path }}
          BRANCH_NAME: ${{ steps.prep.outputs.branch_name }}
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH_NAME"
          git add "$PLAN_PATH"
          git commit -m "plan: add draft spec $PLAN_ID"
          git push origin "$BRANCH_NAME"

          gh pr create \
            --title "Plan: $PLAN_ID" \
            --body-file /tmp/pr_body.md \
            --head "$BRANCH_NAME"
