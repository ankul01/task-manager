name: Plan a requirement

on:
  workflow_dispatch:
    inputs:
      requirement:
        description: "A small, non-sensitive product requirement"
        required: true
        type: string
      slug:
        description: "Short filename label (optional, e.g. add-due-dates)"
        required: false
        type: string
      model:
        description: "Optional model override (e.g. gemini-3.8-flash). Activates single-route mode."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  plan:
    permissions:
      contents: write
      pull-requests: write
    uses: ankul01/agent-factory/.github/workflows/reusable-planner.yml@main
    with:
      requirement: ${{ inputs.requirement }}
      slug: ${{ inputs.slug }}
      model: ${{ inputs.model }}
    secrets: inherit
