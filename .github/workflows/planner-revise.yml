name: Revise a plan from PR feedback

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  revise:
    if: |
      github.event.issue.pull_request != null &&
      github.actor == github.repository_owner &&
      startsWith(github.event.comment.body, '/revise')
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ankul01/agent-factory/.github/workflows/reusable-planner-revise.yml@main
    with:
      pr_number: ${{ github.event.issue.number }}
      comment_body: ${{ github.event.comment.body }}
    secrets: inherit
