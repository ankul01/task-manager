name: Revise a plan from PR feedback

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  revise:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      github.event.issue.pull_request != null &&
      github.actor == github.repository_owner &&
      startsWith(github.event.comment.body, '/revise')

    steps:
      - name: Validate PR & Branch
        id: pr_info
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          PR_JSON=$(gh pr view "$PR_NUMBER" --json headRefName,state)
          STATE=$(echo "$PR_JSON" | jq -r .state)
          HEAD_REF=$(echo "$PR_JSON" | jq -r .headRefName)

          if [ "$STATE" != "OPEN" ]; then
            echo "PR #$PR_NUMBER is not OPEN (state: $STATE). Exiting."
            exit 0
          fi

          if [[ "$HEAD_REF" != plan/* ]]; then
            echo "PR headRefName '$HEAD_REF' does not start with 'plan/'. Exiting."
            exit 0
          fi

          PLAN_ID="${HEAD_REF#plan/}"
          PLAN_PATH="docs/plans/${PLAN_ID}.md"

          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "plan_id=$PLAN_ID" >> "$GITHUB_OUTPUT"
          echo "plan_path=$PLAN_PATH" >> "$GITHUB_OUTPUT"

      - name: Checkout PR Branch
        if: steps.pr_info.outputs.head_ref != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_info.outputs.head_ref }}
          fetch-depth: 0

      - name: Revise Plan with Gemini
        id: revise
        if: steps.pr_info.outputs.head_ref != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-4-hydrogen' }}
          PLAN_PATH: ${{ steps.pr_info.outputs.plan_path }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import random
          import sys
          import time
          import urllib.error
          import urllib.request

          key = os.environ.get("GEMINI_API_KEY", "").strip()
          model = os.environ.get("GEMINI_MODEL", "").strip() or "gemini-4-hydrogen"
          plan_path_str = os.environ.get("PLAN_PATH", "").strip()
          comment_body = os.environ.get("COMMENT_BODY", "")
          run_url = os.environ.get("RUN_URL", "")

          if not key:
              sys.exit("GEMINI_API_KEY is not configured.")
          if not model:
              sys.exit("GEMINI_MODEL is empty.")
          if not plan_path_str:
              sys.exit("PLAN_PATH is empty.")

          feedback = comment_body.strip()
          if feedback.startswith("/revise"):
              feedback = feedback[len("/revise"):].strip()

          if not feedback:
              sys.exit("Feedback following /revise is empty.")

          plan_file = pathlib.Path(plan_path_str)
          if not plan_file.is_file():
              sys.exit(f"Plan file not found: {plan_path_str}")

          current_plan = plan_file.read_text(encoding="utf-8")
          revised_at = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          print(f"Using Gemini model: {model}")
          print(f"Revising plan: {plan_path_str}")

          prompt = f"""You are a software planning assistant.

          A user has requested revisions on an existing draft software plan.
          Revise the plan by applying the feedback thoroughly while keeping existing decisions that are still valid.

          Instructions:
          1. Return the COMPLETE revised Markdown document.
          2. Preserve the YAML frontmatter at the very top (`---`), keeping existing fields (`plan_id`, `status: draft`, `created_at`, `model`, `workflow_run_url`, `requirement`).
          3. Add or update the frontmatter field `revised_at: "{revised_at}"`.
          4. Keep the human review header right below the frontmatter:
             > **Human Review Required:** Merging this Pull Request to the default branch marks this exact file and commit SHA as approved for implementation.
          5. Do not claim to have inspected a repository.
          6. Do not write or execute code.
          7. Output only the revised markdown text. Do not wrap the entire response in triple backticks.

          Existing Plan Document:
          {current_plan}

          User Feedback:
          {feedback}
          """

          url = (
              f"https://generativelanguage.googleapis.com/v1beta/"
              f"models/{model}:generateContent"
          )

          body = json.dumps({
              "contents": [{"parts": [{"text": prompt}]}]
          }).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=body,
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": key,
              },
              method="POST",
          )

          for attempt in range(4):
              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      result = json.load(response)
                  break
              except urllib.error.HTTPError as error:
                  if error.code in (429, 503) and attempt < 3:
                      delay = (2 ** (attempt + 1)) + random.uniform(0, 1)
                      print(f"Gemini returned HTTP {error.code}; retrying in {delay:.1f}s.")
                      time.sleep(delay)
                  else:
                      sys.exit(f"Gemini API request failed: HTTP {error.code}")
              except urllib.error.URLError:
                  sys.exit("Could not reach the Gemini API.")

          candidates = result.get("candidates", [])
          if not candidates:
              sys.exit("Gemini returned no response. Check model access and quota.")

          parts = candidates[0].get("content", {}).get("parts", [])
          text = "\n".join(part.get("text", "") for part in parts).strip()
          if not text:
              sys.exit("Gemini returned an empty response.")

          # Strip enclosing markdown code block if model wrapped entire output
          if text.startswith("```markdown") and text.endswith("```"):
              text = text[len("```markdown"): -3].strip()
          elif text.startswith("```") and text.endswith("```"):
              text = text[3:-3].strip()

          plan_file.write_text(text + "\n", encoding="utf-8")

          # Write safe PR reply file
          pr_reply = (
              f"## Plan Revised from Feedback\n\n"
              f"The draft plan has been updated per your `/revise` comment.\n\n"
              f"- **File:** `{plan_path_str}`\n"
              f"- **Model:** `{model}`\n"
          )
          pathlib.Path("/tmp/reply_body.md").write_text(pr_reply, encoding="utf-8")
          PY

      - name: Commit to PR branch and reply
        if: steps.pr_info.outputs.head_ref != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          HEAD_REF: ${{ steps.pr_info.outputs.head_ref }}
          PLAN_ID: ${{ steps.pr_info.outputs.plan_id }}
          PLAN_PATH: ${{ steps.pr_info.outputs.plan_path }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$PLAN_PATH"
          git commit -m "plan: revise $PLAN_ID from PR feedback"
          git push origin "HEAD:$HEAD_REF"

          COMMIT_SHA=$(git rev-parse --short HEAD)
          {
            echo "- **Commit:** \`$COMMIT_SHA\`"
            echo "- **Workflow Run:** $RUN_URL"
            echo ""
            echo "Review the updated Markdown document in the **Files changed** tab."
          } >> /tmp/reply_body.md

          gh pr comment "$PR_NUMBER" --body-file /tmp/reply_body.md
