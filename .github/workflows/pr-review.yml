name: PR Tests and AI Code Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'docs/plans/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-review:
    if: ${{ !startsWith(github.head_ref, 'plan/') }}
    permissions:
      contents: read
      pull-requests: write
    uses: ankul01/agent-factory/.github/workflows/reusable-pr-review.yml@main
    with:
      runtime: java21
    secrets: inherit
