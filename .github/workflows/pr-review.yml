name: PR Tests and AI Code Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'docs/plans/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    if: ${{ !startsWith(github.head_ref, 'plan/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Maven tests
        if: hashFiles('pom.xml') != ''
        run: mvn -B test

  ai-review:
    if: ${{ !startsWith(github.head_ref, 'plan/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Fetch PR diff and run Gemini review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_REVIEW_MODEL || vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          gh pr diff "$PR_NUMBER" > /tmp/pr.diff

          python3 - <<'PY'
          import json
          import os
          import pathlib
          import random
          import re
          import sys
          import time
          import urllib.error
          import urllib.request

          key = os.environ.get("GEMINI_API_KEY", "").strip()
          configured_model = os.environ.get("GEMINI_MODEL", "gemini-3.8-flash").strip()
          pr_body = os.environ.get("PR_BODY", "")
          run_url = os.environ["RUN_URL"]

          if not key:
              comment = (
                  "## Automated Code Review Notice\n\n"
                  "> **Notice:** `GEMINI_API_KEY` is not configured. Automated code review was skipped.\n\n"
                  f"---\n*[Workflow Run]({run_url})*\n"
              )
              pathlib.Path("/tmp/review_body.md").write_text(comment, encoding="utf-8")
              sys.exit(0)

          diff_text = pathlib.Path("/tmp/pr.diff").read_text(encoding="utf-8", errors="replace")
          if not diff_text.strip():
              print("PR diff is empty; skipping review.")
              sys.exit(0)

          # Keep diff within a safe size for single-pass review
          max_diff_chars = 100000
          if len(diff_text) > max_diff_chars:
              diff_text = diff_text[:max_diff_chars] + "\n\n... [DIFF TRUNCATED]"

          # If the PR references an approved plan in docs/plans/, load it for contract verification
          plan_context = "No approved plan file referenced in PR body."
          plan_match = re.search(r"(docs/plans/[A-Za-z0-9._-]+\.md)", pr_body)
          if plan_match:
              plan_path = pathlib.Path(plan_match.group(1))
              if plan_path.exists():
                  plan_context = f"Approved Plan ({plan_path}):\n\n" + plan_path.read_text(encoding="utf-8")

          instructions = """You are a senior Java/Spring Boot code reviewer for an automated software factory.
          Review the PR diff against the approved plan (if provided).
          Provide a balanced, thorough, and constructive review.

          Always include positive feedback highlighting what was done well (architecture, clean code, Spring Boot best practices, test coverage, validation, etc.).
          Even if all things look fine and there are no blocking issues, always provide detailed positive review comments and appreciation for what is well implemented.

          Format your output strictly in this Markdown structure:

          ## Automated Code Review Summary
          - **Approved Plan Checked:** <path or "None referenced">
          - **Verdict:** `APPROVED` or `CHANGES_REQUESTED`

          ### What Looks Good (Key Strengths)
          - <Detail what is implemented well: clean architecture, correct annotations, robust validation, good test coverage, etc.>
          - <Concrete praise referencing specific files and classes in the diff>

          ### Minor Feedback & Suggestions (Optional / Non-Blocking)
          - <Constructive suggestions, code style tips, future improvements, or "None">

          ### Blocking Issues (Must Fix Before Merge)
          - <Only list critical bugs or violated requirements. If all things look good, write "None - ready to merge.">"""

          user_prompt = f"""{instructions}

          {plan_context}

          ---
          ### Pull Request Diff
          ```diff
          {diff_text}
          ```"""

          body = json.dumps({
              "contents": [{"parts": [{"text": user_prompt}]}]
          }).encode("utf-8")

          models_to_try = [
              configured_model,
              "gemini-3.8-flash",
              "gemini-3.6-flash",
              "gemini-4-hydrogen",
          ]
          seen = set()
          models = []
          for m in models_to_try:
              if m and m not in seen:
                  seen.add(m)
                  models.append(m)

          review_text = ""
          resolved_model = configured_model

          for current_model in models:
              print(f"Running Gemini code review with model: {current_model}")
              url = f"https://generativelanguage.googleapis.com/v1beta/models/{current_model}:generateContent"
              request = urllib.request.Request(
                  url,
                  data=body,
                  headers={
                      "Content-Type": "application/json",
                      "x-goog-api-key": key,
                  },
                  method="POST",
              )

              success = False
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(request, timeout=120) as response:
                          result = json.load(response)
                      success = True
                      break
                  except urllib.error.HTTPError as error:
                      err_body = error.read().decode("utf-8", errors="replace")[:300]
                      if error.code in (429, 503) and attempt < 3:
                          delay = (2 ** (attempt + 1)) + random.uniform(0, 1)
                          print(f"Gemini returned HTTP {error.code}; retrying in {delay:.1f}s.")
                          time.sleep(delay)
                      else:
                          print(f"Gemini model '{current_model}' failed: HTTP {error.code} — {err_body}")
                          break
                  except urllib.error.URLError as e:
                      print(f"Could not reach Gemini API with '{current_model}': {e}")
                      break

              if success:
                  candidates = result.get("candidates", [])
                  if candidates:
                      parts = candidates[0].get("content", {}).get("parts", [])
                      review_text = "\n".join(part.get("text", "") for part in parts).strip()
                      if review_text:
                          resolved_model = current_model
                          break

          if not review_text:
              comment = (
                  "## Automated Code Review Notice\n\n"
                  "> **Notice:** Automated code review could not be generated due to temporary AI service unavailability. All automated test suites passed.\n\n"
                  f"---\n*[Workflow Run]({run_url})*\n"
              )
          else:
              comment = (
                  f"{review_text}\n\n"
                  f"---\n"
                  f"*Model: `{resolved_model}` • [Workflow Run]({run_url})*\n"
              )

          pathlib.Path("/tmp/review_body.md").write_text(comment, encoding="utf-8")
          PY

      - name: Post review comment to PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          if [ -s /tmp/review_body.md ]; then
            gh pr comment "$PR_NUMBER" --body-file /tmp/review_body.md
          else
            echo "No review comment file found to post."
          fi
