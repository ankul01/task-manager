name: PR Tests and AI Code Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'docs/plans/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    if: ${{ !startsWith(github.head_ref, 'plan/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Maven tests
        if: hashFiles('pom.xml') != ''
        run: mvn -B test

  ai-review:
    if: ${{ !startsWith(github.head_ref, 'plan/') }}
    runs-on: ubuntu-slim
    timeout-minutes: 12
    continue-on-error: true
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Fetch PR diff
        env:
          GH_TOKEN:  ${{ github.token }}
          GH_REPO:   ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: gh pr diff "$PR_NUMBER" > /tmp/pr.diff

      - name: Build review prompt
        id: prep
        env:
          PR_BODY:  ${{ github.event.pull_request.body }}
          RUN_URL:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          pr_body = os.environ.get("PR_BODY", "")
          run_url = os.environ["RUN_URL"]

          diff_text = pathlib.Path("/tmp/pr.diff").read_text(encoding="utf-8", errors="replace")
          if not diff_text.strip():
              print("PR diff is empty; skipping review.")
              pathlib.Path("/tmp/prompt.txt").write_text("", encoding="utf-8")
              import sys; sys.exit(0)

          # Keep diff within a safe size for single-pass review
          max_diff_chars = 100000
          if len(diff_text) > max_diff_chars:
              diff_text = diff_text[:max_diff_chars] + "\n\n... [DIFF TRUNCATED]"

          # If the PR references an approved plan in docs/plans/, load it for contract verification
          plan_context = "No approved plan file referenced in PR body."
          plan_match = re.search(r"(docs/plans/[A-Za-z0-9._-]+\.md)", pr_body)
          if plan_match:
              plan_path = pathlib.Path(plan_match.group(1))
              if plan_path.exists():
                  plan_context = f"Approved Plan ({plan_path}):\n\n" + plan_path.read_text(encoding="utf-8")

          system_prompt = """You are a senior Java/Spring Boot code reviewer for an automated software factory.
          Review the PR diff against the approved plan (if provided).
          Provide a balanced, thorough, and constructive review.

          Always include positive feedback highlighting what was done well (architecture, clean code, Spring Boot best practices, test coverage, validation, etc.).
          Even if all things look fine and there are no blocking issues, always provide detailed positive review comments and appreciation for what is well implemented.

          Format your output strictly in this Markdown structure:

          ## Automated Code Review Summary
          - **Approved Plan Checked:** <path or "None referenced">
          - **Verdict:** `APPROVED` or `CHANGES_REQUESTED`

          ### What Looks Good (Key Strengths)
          - <Detail what is implemented well: clean architecture, correct annotations, robust validation, good test coverage, etc.>
          - <Concrete praise referencing specific files and classes in the diff>

          ### Minor Feedback & Suggestions (Optional / Non-Blocking)
          - <Constructive suggestions, code style tips, future improvements, or "None">

          ### Blocking Issues (Must Fix Before Merge)
          - <Only list critical bugs or violated requirements. If all things look good, write "None - ready to merge.">"""

          user_prompt = f"""{plan_context}

          ---
          ### Pull Request Diff
          ```diff
          {diff_text}
          ```"""

          pathlib.Path("/tmp/system.txt").write_text(system_prompt, encoding="utf-8")
          pathlib.Path("/tmp/prompt.txt").write_text(user_prompt,   encoding="utf-8")
          PY

      - name: Run AI review via LLM waterfall
        id: ai_review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY:   ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [ ! -s /tmp/prompt.txt ]; then
            echo "Empty prompt; skipping LLM call."
            exit 0
          fi
          python3 .github/scripts/llm_client.py \
            --profile reviewer \
            --system-file /tmp/system.txt \
            --prompt-file /tmp/prompt.txt \
            --output-file /tmp/llm_out.txt \
            --meta-file   /tmp/meta.json

      - name: Assemble review comment
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib

          run_url = os.environ["RUN_URL"]
          out_path  = pathlib.Path("/tmp/llm_out.txt")
          meta_path = pathlib.Path("/tmp/meta.json")

          if not out_path.exists() or not out_path.stat().st_size:
              comment = (
                  "## Automated Code Review Notice\n\n"
                  "> **Notice:** Automated code review could not be generated "
                  "due to temporary AI service unavailability. All automated test suites passed.\n\n"
                  f"---\n*[Workflow Run]({run_url})*\n"
              )
          else:
              review_text = out_path.read_text(encoding="utf-8").strip()
              meta        = json.loads(meta_path.read_text(encoding="utf-8"))
              model       = meta["model"]
              route_name  = meta["route_name"]
              comment = (
                  f"{review_text}\n\n"
                  f"---\n"
                  f"*Model: `{model}` · Route: `{route_name}` · [Workflow Run]({run_url})*\n"
              )

          pathlib.Path("/tmp/review_body.md").write_text(comment, encoding="utf-8")
          PY

      - name: Post review comment to PR
        env:
          GH_TOKEN:  ${{ github.token }}
          GH_REPO:   ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          if [ -s /tmp/review_body.md ]; then
            gh pr comment "$PR_NUMBER" --body-file /tmp/review_body.md
          else
            echo "No review comment file found to post."
          fi
