name: Trigger Cursor Coding Agent on Approved Plan

on:
  pull_request:
    branches: [main]
    types: [closed]
    paths:
      - 'docs/plans/**'

permissions:
  contents: read

jobs:
  launch-cursor-coder:
    # Fires ONLY when a plan/* PR is actually merged to main
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'plan/')
    permissions:
      contents: read
    uses: ankul01/agent-factory/.github/workflows/reusable-trigger-coder.yml@main
    with:
      head_ref: ${{ github.head_ref }}
      base_ref: ${{ github.base_ref }}
      merge_commit_sha: ${{ github.event.pull_request.merge_commit_sha }}
      pr_number: "${{ github.event.pull_request.number }}"
      pr_body: ${{ github.event.pull_request.body }}
      cursor_model: ${{ vars.CURSOR_MODEL }}
    secrets: inherit
