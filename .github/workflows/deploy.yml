name: Package, Release, and Deploy Staging

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/plans/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package Spring Boot JAR
        if: hashFiles('pom.xml') != ''
        run: mvn -B package -DskipTests

      - name: Publish Versioned GitHub Release
        if: hashFiles('pom.xml') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v0.1.${{ github.run_number }}.${{ github.run_attempt }}
        shell: bash
        run: |
          JAR_FILE=$(ls target/*.jar | grep -v '\.original$' | head -n 1)
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; skipping create."
            exit 0
          fi
          gh release create "$TAG_NAME" "$JAR_FILE" \
            --target "${{ github.sha }}" \
            --title "Release $TAG_NAME" \
            --notes "Automated release from commit ${{ github.sha }}."

  deploy-staging:
    permissions:
      contents: read
      packages: write
    uses: ankul01/agent-factory/.github/workflows/reusable-deploy-render.yml@main
    with:
      staging_url: ${{ vars.RENDER_STAGING_URL }}
      health_path: /actuator/health
      image_name: task-manager
    secrets: inherit
